# Nginx Configuration File
# This file configures the reverse proxy server which routes incoming external requests
# to either the frontend React application or the backend FastAPI application.

events {
    # Default connection settings
    worker_connections 1024;
}

http {
    # Include standard MIME types to ensure correct rendering of CSS/JS files
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        # Listen on port 80 for incoming web traffic
        listen 80;

        # Route requests targeting /api/ to the backend container (FastAPI)
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route all other web traffic to the frontend container (React app running inside Nginx)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}